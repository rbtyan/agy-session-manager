# Dedicated tmux configuration for AGY Session Manager (-L agym)
set -g status off
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -g base-index 0
set -g renumber-windows off
set -g remain-on-exit off

# Double-tap Left Arrow inside any agy session window -> switch to Session Manager
bind-key -n Left if-shell -F '#{==:#{window_name},manager}' \
    'send-keys Left' \
    'run-shell -b "\"$AGYM_APP_DIR/double_left.sh\""'

# Instant unconditional fallback shortcuts to return to Session Manager
bind-key -n M-Left if-shell -F '#{==:#{window_name},manager}' \
    'send-keys M-Left' \
    'select-window -t main:manager'

bind-key -n C-Left if-shell -F '#{==:#{window_name},manager}' \
    'send-keys C-Left' \
    'select-window -t main:manager'
